name: Disparador horario

# Llama cada hora al endpoint que ejecuta las reglas programadas a las que ya les toca, para que cada
# regla corra a la hora que se eligió (el cron de Vercel del plan gratuito sólo corre una vez al día).
# Requiere dos "secrets" del repositorio (Settings > Secrets and variables > Actions):
#   APP_URL      la dirección de la app, ej. https://controlador-gastos-sage.vercel.app
#   CRON_SECRET  el mismo valor que la variable CRON_SECRET de Vercel
# Si faltan, el paso se saltea sin fallar.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  reglas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ejecutar reglas programadas
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secrets APP_URL y/o CRON_SECRET: no se llama a la app."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reglas"
